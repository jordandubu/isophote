<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>isophote — turn photos into oil paintings in your browser</title>
<meta name="description" content="Free online oil-paint filter: flow-guided brush strokes that follow your photo's contours. Runs fully in your browser with WebAssembly — no upload, instant.">
<link rel="icon" type="image/png" href="icon.png">
<meta property="og:title" content="isophote — photos → oil paintings, right in your browser">
<meta property="og:description" content="Flow-guided brush strokes that follow your photo's contours. Runs fully client-side, nothing uploaded.">
<meta property="og:image" content="https://jordandubu.github.io/isophote/icon.png">
<meta property="og:url" content="https://jordandubu.github.io/isophote/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
:root {
  --bg: rgb(17,17,17); --surface: rgb(28,28,30); --elev: rgb(44,44,46);
  --txt: rgb(204,204,204); --txt2: rgb(142,142,147); --txt3: rgb(99,99,102);
  --accent: rgb(10,132,255); --mod: rgb(255,214,10);
  --border: rgba(255,255,255,0.06);
}
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; color: var(--txt); background: var(--bg); margin: 0;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { height: 44px; flex: none; display: flex; align-items: center;
  gap: 16px; padding: 0 16px; background: var(--surface);
  border-bottom: 1px solid var(--border); }
header .logo { font-weight: 600; color: #fff; letter-spacing: 0.3px; font-size: 13px; }
header .btn { background: var(--elev); color: var(--txt); border: 1px solid var(--border);
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  transition: background .12s; }
header .btn:hover { background: #555; }
header .btn.primary { background: var(--accent); color: #fff; border: none; }
header .btn.primary:hover { background: rgb(50,150,255); }
header .btn:disabled { opacity: 0.4; cursor: default; }
header .spacer { flex: 1; }
#status { color: var(--txt3); font-size: 12px; }
main { flex: 1; display: flex; min-height: 0; }
/* ---- canvas area ---- */
#stage { flex: 1; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; }
#stage img { max-width: 92%; max-height: 92%; border-radius: 2px; }
#viewBtns { position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  display: none; gap: 0; z-index: 5; background: rgba(28,28,30,0.85);
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
#viewBtns .vbtn { background: transparent; color: var(--txt2); border: none;
  padding: 7px 18px; cursor: pointer; font-size: 12.5px; transition: all .12s; }
#viewBtns .vbtn:hover { color: var(--txt); }
#viewBtns .vbtn.on { background: var(--elev); color: #fff; }
/* image hover actions (enlarge + close, close on the right) */
#imgWrap { position: relative; display: flex; align-items: center;
  justify-content: center; max-width: 96%; max-height: 96%; }
#imgWrap img { max-width: 100%; max-height: 96vh; border-radius: 2px;
  transition: filter .18s; }
#imgWrap:hover img { filter: brightness(0.92); }
#imgActions { position: absolute; top: 10px; right: 10px; display: flex;
  gap: 8px; opacity: 0; transition: opacity .15s; }
#imgWrap:hover #imgActions { opacity: 1; }
.abtn { width: 32px; height: 32px; border-radius: 50%; border: none;
  background: rgba(20,20,22,0.55); color: rgba(255,255,255,0.75);
  font-size: 14px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; backdrop-filter: blur(6px);
  box-shadow: 0 1px 6px rgba(0,0,0,0.35);
  transition: background .12s, color .12s, transform .12s; }
.abtn:hover { background: rgba(20,20,22,0.85); color: #fff; transform: scale(1.06); }
.abtn svg { width: 14px; height: 14px; stroke: currentColor;
  stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#drop { position: absolute; inset: 10%; border: 2px dashed var(--txt3);
  border-radius: 12px; display: flex; flex-direction: column; gap: 8px;
  align-items: center; justify-content: center; cursor: pointer;
  color: var(--txt2); transition: border-color .15s, background .15s; }
#drop:hover, #drop.drag { border-color: var(--accent); background: rgba(10,132,255,0.04); }
#drop .big { font-size: 15px; color: var(--txt); }
#drop .small { font-size: 12px; color: var(--txt3); }
/* ---- side panel ---- */
#panel { width: 300px; flex: none; background: var(--surface);
  border-left: 1px solid var(--border); overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 4px; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { padding: 5px 12px; border-radius: 14px; background: var(--elev);
  border: 1px solid var(--border); color: var(--txt2); font-size: 12px;
  cursor: pointer; transition: all .12s; }
.chip:hover { color: var(--txt); }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.slider { padding: 8px 0; }
.slider .row { display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 4px; }
.slider label { font-size: 11px; letter-spacing: 0.2px; color: var(--txt2);
  font-weight: 500; }
.slider .v { font-size: 12px; color: var(--txt3); font-variant-numeric: tabular-nums; }
.slider input[type=range] { width: 100%; height: 22px; -webkit-appearance: none;
  background: transparent; cursor: pointer; margin: 0; }
.slider input[type=range]::-webkit-slider-runnable-track { height: 3px;
  background: var(--elev); border-radius: 2px; }
.slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none;
  width: 15px; height: 15px; border-radius: 50%; background: #fff;
  margin-top: -6px; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.slider input[type=range]::-moz-range-track { height: 3px;
  background: var(--elev); border-radius: 2px; }
.slider input[type=range]::-moz-range-thumb { width: 15px; height: 15px;
  border-radius: 50%; background: #fff; border: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--mod);
  display: inline-block; margin-left: 5px; vertical-align: 1px; }
input[type=file] { display: none; }
/* ---- mobile: fullscreen effects menu ---- */
#menuBtn { display: none; align-items: center; justify-content: center;
  width: 36px; height: 32px; padding: 0; }
#menuBtn .icon { width: 18px; height: 18px; stroke: currentColor;
  stroke-width: 2; fill: none; stroke-linecap: round; }
#overlay { display: none; position: fixed; inset: 0; z-index: 30;
  background: var(--bg); flex-direction: column; }
#overlay.open { display: flex; }
#overlay .head { flex: none; display: flex; align-items: center;
  gap: 10px; height: 52px; padding: 0 14px; background: var(--surface);
  border-bottom: 1px solid var(--border); }
#overlay .head .t { flex: 1; font-size: 13px; font-weight: 600; color: #fff; }
#overlay .body { flex: 1; overflow-y: auto; padding: 16px 18px
  calc(16px + env(safe-area-inset-bottom)); }
#overlay .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
#overlay .slider { padding: 12px 0; }
#overlay .slider label { font-size: 13px; }
#overlay .slider .v { font-size: 14px; color: var(--txt2); }
#overlay .slider input[type=range] { height: 30px; }
#overlay .slider input[type=range]::-webkit-slider-thumb {
  width: 26px; height: 26px; margin-top: -12px; }
#overlay .slider input[type=range]::-moz-range-thumb {
  width: 26px; height: 26px; }
@media (max-width: 760px) {
  header { gap: 8px; padding: 0 10px; }
  #menuBtn { display: flex; }
  header .btn { padding: 0; }              /* icon buttons, no text */
  header .btn.primary { padding: 8px 14px; } /* Export keeps its text */
  header #status { display: none; }        /* declutter; timing shows in overlay title */
  #viewBtns { top: 10px; }
  #viewBtns .vbtn { padding: 9px 22px; }  /* larger touch target */
  #panel { display: none; }              /* effects live in the hamburger overlay on phone */
}
@media (pointer: coarse) {
  #imgActions { opacity: 1; }                 /* no hover on touch: always show */
  .abtn { width: 38px; height: 38px; }        /* bigger touch targets */
  .abtn svg { width: 17px; height: 17px; }
  .chip { padding: 7px 14px; }
}
</style></head>
<body>
<header>
  <div class="logo">isophote</div>
  <div class="spacer"></div>
  <div id="status"></div>
  <button class="btn" id="menuBtn" title="Effects"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="btn primary" id="export" style="display:none" disabled>Export</button>
</header>
<main>
  <div id="stage">
    <div id="viewBtns" style="display:none">
      <button class="vbtn on" id="viewOriginal">Input</button>
      <button class="vbtn" id="viewResult">Result</button>
    </div>
    <div id="imgWrap" style="display:none">
      <img id="solo">
      <div id="imgActions">
        <button class="abtn" id="download" title="Download">
          <svg viewBox="0 0 24 24"><path d="M12 3v12M6 9l6 6 6-6M4 21h16"/></svg>
        </button>
        <button class="abtn" id="clear" title="Remove image">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div id="drop">
      <div class="big">Drop a photo</div>
      <div class="small">or click to browse &middot; all computation happens in your browser</div>
    </div>
  </div>
  <div id="panel">
    <div class="presets">
      <div class="chip on" data-p="art">Art</div>
      <div class="chip" data-p="medium">Medium</div>
      <div class="chip" data-p="bold">Impasto</div>
      <div class="chip" data-p="pastel">Pastel</div>
    </div>
    <div class="slider"><div class="row"><label>Stroke length<span class="dot" id="d_len" style="visibility:hidden"></span></label><span class="v" id="v_len">45</span></div>
      <input type="range" id="len" min="10" max="90" value="45"></div>
    <div class="slider"><div class="row"><label>Stroke width<span class="dot" id="d_width" style="visibility:hidden"></span></label><span class="v" id="v_width">3</span></div>
      <input type="range" id="width" min="2" max="14" value="3"></div>
    <div class="slider"><div class="row"><label>Layers<span class="dot" id="d_layers" style="visibility:hidden"></span></label><span class="v" id="v_layers">4</span></div>
      <input type="range" id="layers" min="1" max="6" value="4"></div>
    <div class="slider"><div class="row"><label>Flow coherence<span class="dot" id="d_flow_smooth" style="visibility:hidden"></span></label><span class="v" id="v_flow_smooth">8</span></div>
      <input type="range" id="flow_smooth" min="2" max="24" value="8"></div>
    <div class="slider"><div class="row"><label>Base flatten<span class="dot" id="d_base_radius" style="visibility:hidden"></span></label><span class="v" id="v_base_radius">6</span></div>
      <input type="range" id="base_radius" min="2" max="16" value="6"></div>
    <div class="slider"><div class="row"><label>Canvas relief<span class="dot" id="d_relief" style="visibility:hidden"></span></label><span class="v" id="v_relief">0.10</span></div>
      <input type="range" id="relief" min="0" max="0.6" step="0.05" value="0.10"></div>
    <div class="slider"><div class="row"><label>Seed<span class="dot" id="d_seed" style="visibility:hidden"></span></label><span class="v" id="v_seed">42</span></div>
      <input type="range" id="seed" min="1" max="200" value="42"></div>
    <div id="settingsToggle" class="row" style="margin-top:14px; cursor:pointer; align-items:center; gap:6px; color:var(--txt3); font-size:12px;">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </div>
    <div id="settings" style="display:none; flex-direction:column; gap:8px; margin-top:10px;">
      <div style="font-size:11px; letter-spacing:.2px; color:var(--txt2); font-weight:500; margin-bottom:6px;">Add-ons</div>
      <label id="addonBlenderRow" style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--txt2); cursor:pointer;">
        <input type="checkbox" id="addonBlender"> Blender bridge
      </label>
      <div id="bridgeBar" style="display:none; align-items:center; gap:8px; margin-top:8px;">
        <button class="chip" id="bridgeSend" style="padding:6px 12px; border-radius:14px;">Send to Blender</button>
        <span id="bridgeState" style="font-size:11px; color:var(--txt3);"></span>
      </div>
    </div>
  </div>
</main>
<div id="overlay">
  <div class="head">
    <div class="t">Effects</div>
    <button class="btn" id="overlayDone">Done</button>
  </div>
  <div class="body" id="overlayBody"></div>
</div>
<input type="file" id="file" accept="image/*">
<script src="wasm.js"></script>
<script>
const PRESETS = {
  art:    {len:45, width:3, layers:4, flow_smooth:8, base_radius:6, relief:0.10},
  medium: {len:30, width:4, layers:3, flow_smooth:8, base_radius:6, relief:0.15},
  bold:   {len:60, width:5, layers:2, flow_smooth:8, base_radius:8, relief:0.10},
  pastel: {len:30, width:5, layers:3, flow_smooth:8, base_radius:9, relief:0.00},
};
const DEFAULTS = {len:45, width:3, layers:4, flow_smooth:8, base_radius:6, relief:0.10, seed:42};
const KEYS = ["len","width","layers","flow_smooth","base_radius","relief","seed"];
let srcBgrBytes = null, origURL = null, paintedURL = null, presetOn = "art", srcExt = "png";
let srcW = 0, srcH = 0;
const $ = id => document.getElementById(id);
let overlayBody = null;
for (const k of KEYS) {
  const el = $(k);
  el.addEventListener("input", () => {
    $("v_"+k).textContent = el.value;
    if (overlayBody) overlayBody.querySelectorAll("#v_"+k).forEach(v => v.textContent = el.value);
    const def = DEFAULTS[k];
    $("d_"+k).style.visibility = (+el.value !== def) ? "visible" : "hidden";
    if (overlayBody) { const cd = overlayBody.querySelector("#d_"+k); if (cd) cd.style.visibility = $("d_"+k).style.visibility; }
    if (+el.value !== def) presetOn = null;
    scheduleLive();
  });
}
document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");
  presetOn = c.dataset.p;
  const p = PRESETS[presetOn];
  for (const k in p) { $(k).value = p[k]; $("v_"+k).textContent = p[k];
    $("d_"+k).style.visibility = "hidden"; }
  if (overlayBody) overlayBody.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.p === presetOn));
  scheduleLive();
});
/* mobile hamburger: fullscreen effects menu mirrors the panel controls live */
const overlayBodyEl = $("overlayBody");
overlayBody = overlayBodyEl;
function syncOverlay() {
  const panel = $("panel");
  if (overlayBody.dataset.built !== "1") {
    panel.querySelectorAll(".presets .chip").forEach(c => {
      const clone = c.cloneNode(true);
      clone.onclick = () => { c.click(); syncOverlay(); };
      overlayBody.appendChild(clone);
    });
    panel.querySelectorAll(".slider").forEach(sl => {
      const clone = sl.cloneNode(true);
      const input = clone.querySelector("input");
      input.addEventListener("input", () => {
        $(input.id).value = input.value;
        $(input.id).dispatchEvent(new Event("input", {bubbles: false}));
      });
      overlayBody.appendChild(clone);
    });
    overlayBody.dataset.built = "1";
  }
  overlayBody.querySelectorAll("input[type=range]").forEach(r => r.value = $(r.id).value);
  overlayBody.querySelectorAll(".v").forEach(v => v.textContent = $("v_" + v.id.slice(2)).textContent);
  overlayBody.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.p === presetOn));
  overlayBody.querySelectorAll(".dot").forEach(d => d.style.visibility = $("d_" + d.id.slice(2)).style.visibility);
}
$("menuBtn").onclick = () => { syncOverlay(); $("overlay").classList.add("open"); };
$("overlayDone").onclick = () => $("overlay").classList.remove("open");
/* drop zone */
const stage = $("stage"), drop = $("drop");
drop.onclick = () => $("file").click();
["dragenter","dragover"].forEach(ev => stage.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add("drag");
}));
["dragleave","dragend"].forEach(ev => stage.addEventListener(ev, () =>
  drop.classList.remove("drag")));
stage.addEventListener("drop", e => { e.preventDefault();
  drop.classList.remove("drag");
  if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });
$("file").onchange = e => { if (e.target.files[0]) load(e.target.files[0]); };
/* default sample: paint silently, show the RESULT immediately on open */
fetch("test_photo.jpg").then(r => r.ok ? r.blob() : null).then(b => {
  if (b && !srcBgrBytes) return load(b, {silent: true});
}).then(() => {
  if (srcBgrBytes) livePaint();   // paint right away, result view stays live
});
async function load(f, opts = {}) {
  const bitmap = await createImageBitmap(f);
  if (srcW || srcH) { /* new image replaces old */ }
  srcW = bitmap.width; srcH = bitmap.height;
  origURL = URL.createObjectURL(f);
  srcExt = (f.type && f.type.includes("jpeg")) ? "jpg" : "png";
  // BGRA pixels at full res (python resizes itself)
  const c = document.createElement("canvas");
  c.width = srcW; c.height = srcH;
  const ctx = c.getContext("2d");
  ctx.drawImage(bitmap, 0, 0);
  const imgData = ctx.getImageData(0, 0, srcW, srcH);
  // imagedata is RGBA; python expects BGRA -> swap R/B in JS
  const d = imgData.data;
  srcBgrBytes = new Uint8Array(d.length);
  for (let i = 0; i < d.length; i += 4) {
    srcBgrBytes[i] = d[i+2];     // B
    srcBgrBytes[i+1] = d[i+1];   // G
    srcBgrBytes[i+2] = d[i];     // R
    srcBgrBytes[i+3] = d[i+3];   // A
  }
  drop.style.display = "none";
  $("imgWrap").style.display = "flex";
  $("viewBtns").style.display = "flex";
  $("export").style.display = "";
  if (opts.silent) return;   // result view replaces the photo as soon as painted
  showOrig();
  scheduleLive();
}
/* view switching */
function showOrig() {
  $("solo").src = origURL; $("viewOriginal").classList.add("on");
  $("viewResult").classList.remove("on");
}
function showResult() {
  if (!paintedURL) return;
  $("solo").src = paintedURL; $("viewResult").classList.add("on");
  $("viewOriginal").classList.remove("on");
}
$("viewOriginal").onclick = showOrig;
$("viewResult").onclick = showResult;
/* image actions */
$("clear").onclick = () => {
  srcBgrBytes = origURL = paintedURL = null;
  clearTimeout(liveTimer); liveQueue = false;
  $("imgWrap").style.display = "none";
  $("viewBtns").style.display = "none";
  $("export").style.display = "none";
  drop.style.display = "flex";
  $("status").textContent = "";
};
/* download current view (original before first paint, result after) */
$("download").onclick = () => {
  const onResult = $("viewResult").classList.contains("on");
  const url = onResult && paintedURL ? paintedURL : origURL;
  if (!url) return;
  const a = document.createElement("a");
  a.href = url; a.download = (url === paintedURL ? "isophote" : "input") + "." + (url === paintedURL ? "png" : srcExt);
  a.click();
};
/* live painting */
let liveTimer = null, liveQueue = false, liveBusy = false;
function scheduleLive() {
  if (!srcBgrBytes) return;
  clearTimeout(liveTimer);
  liveTimer = setTimeout(livePaint, 350);
}
function currentParams() {
  const p = {};
  for (const k of ["len","width","layers","flow_smooth","base_radius","relief","seed"])
    p[k] = parseFloat($(k).value);
  return p;
}
async function livePaint() {
  if (liveBusy) { liveQueue = true; return; }
  liveBusy = true;
  $("status").textContent = "painting…";
  try {
    const params = currentParams();
    const { url, ms } = await wasmPaint(srcBgrBytes, srcW, srcH, {
      brush_len: Math.round(params.len),
      brush_w: Math.round(params.width),
      layers: Math.round(params.layers),
      relief: params.relief,
      base_radius: Math.round(params.base_radius),
      flow_smooth: Math.round(params.flow_smooth),
      seed: Math.round(params.seed),
    });
    paintedURL = url;
    if ($("imgWrap").style.display !== "none") $("solo").src = paintedURL;
    showResultLight();
    $("export").disabled = false;
    $("status").textContent = (ms / 1000).toFixed(2) + "s";
  } catch (e) { $("status").textContent = "error: " + (e.message || e); }
  liveBusy = false;
  if (liveQueue) { liveQueue = false; scheduleLive(); }
}
function showResultLight() {
  $("viewResult").classList.add("on");
  $("viewOriginal").classList.remove("on");
}
/* export */
$("export").onclick = () => {
  if (!paintedURL) return;
  const a = document.createElement("a");
  a.href = paintedURL; a.download = "isophote.png"; a.click();
};
/* ============ settings (persisted) ============ */
const BRIDGE_PORT = 8778;
const settings = Object.assign(
  { addonBlender: false },
  JSON.parse(localStorage.getItem("isophote_settings") || "{}"));
function saveSettings() {
  localStorage.setItem("isophote_settings", JSON.stringify(settings));
}
$("settingsToggle").onclick = () => {
  const open = $("settings").style.display !== "none";
  $("settings").style.display = open ? "none" : "flex";
};
$("addonBlender").checked = settings.addonBlender;
function applyAddonState() {
  settings.addonBlender = $("addonBlender").checked;
  $("bridgeBar").style.display = settings.addonBlender ? "flex" : "none";
  saveSettings();
  if (settings.addonBlender) startBridgePolling(); else stopBridgePolling();
}
$("addonBlender").onchange = applyAddonState;
if (settings.addonBlender) { $("bridgeBar").style.display = "flex"; }
/* ============ Blender bridge ============ */
const bridge = { on: false, inFlight: false };
function bridgeURL(path) { return `http://127.0.0.1:${BRIDGE_PORT}${path}`; }
async function bridgePoll() {
  // ask the local bridge whether Blender pushed a new image
  if (bridge.inFlight) return;
  bridge.inFlight = true;
  try {
    const r = await fetch(bridgeURL("/poll"), { method: "POST", body: "{}" });
    const d = await r.json();
    if (d.status) $("bridgeState").textContent = d.status;
    if (d.kind === "image" && d.bgr_png) {
      $("bridgeState").textContent = "received image — painting…";
      const blob = b64ToBlob(d.bgr_png, "image/png");
      await load(blob);                 // reuse the normal load path
      await livePaint();                // paint now, don't wait for debounce
      $("bridgeState").textContent = "painted — sending back";
      await sendToBlender();
      $("bridgeState").textContent = "sent to Blender";
    }
  } catch (e) {
    $("bridgeState").textContent = "bridge offline (run: python3 serve.py)";
  }
  bridge.inFlight = false;
}
async function sendToBlender() {
  if (!paintedURL) { $("bridgeState").textContent = "nothing painted yet"; return; }
  const blob = await (await fetch(paintedURL)).blob();
  const b64 = await blobToB64(blob);
  await fetch(bridgeURL("/send_to_blender"), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ png: b64 }),
  });
}
$("bridgeSend").onclick = () => { sendToBlender(); };
let bridgeTimer = null;
function startBridgePolling() {
  if (bridge.on) return;
  bridge.on = true;
  bridgePoll();
  bridgeTimer = setInterval(bridgePoll, 1500);
}
function stopBridgePolling() {
  bridge.on = false;
  clearInterval(bridgeTimer);
  bridgeTimer = null;
  if ($("bridgeState")) $("bridgeState").textContent = "";
}
if (settings.addonBlender) startBridgePolling();
/* helpers */
function b64ToBlob(b64, type) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type });
}
function blobToB64(blob) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.readAsDataURL(blob);
  });
};
