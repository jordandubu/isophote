<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>isophote — turn photos into oil paintings in your browser</title>
<meta name="description" content="Free online oil-paint filter: flow-guided brush strokes that follow your photo's contours. Runs fully in your browser with WebAssembly — no upload, instant.">
<link rel="icon" type="image/png" href="icon.png">
<meta property="og:title" content="isophote — photos → oil paintings, right in your browser">
<meta property="og:description" content="Flow-guided brush strokes that follow your photo's contours. Runs fully client-side, nothing uploaded.">
<meta property="og:image" content="https://jordandubu.github.io/isophote/icon.png">
<meta property="og:url" content="https://jordandubu.github.io/isophote/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
:root {
  --bg: rgb(17,17,17); --surface: rgb(28,28,30); --elev: rgb(44,44,46);
  --txt: rgb(204,204,204); --txt2: rgb(142,142,147); --txt3: rgb(99,99,102);
  --accent: rgb(10,132,255); --mod: rgb(255,214,10);
  --border: rgba(255,255,255,0.06);
}
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; color: var(--txt); background: var(--bg); margin: 0;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { position: relative; height: 44px; flex: none; display: flex; align-items: center;
  gap: 16px; padding: 0 16px; background: var(--surface);
  border-bottom: 1px solid var(--border); }
header .logo { font-weight: 600; color: #fff; letter-spacing: 0.3px; font-size: 13px;
  position: absolute; left: 50%; transform: translateX(-50%); }
header .btn { background: var(--elev); color: var(--txt); border: 1px solid var(--border);
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  transition: background .12s; }
header .btn:hover { background: #555; }
header a.ghlink { display: flex; align-items: center; justify-content: center;
  width: 32px; height: 30px; border-radius: 6px; color: var(--txt);
  transition: color .12s; }
header a.ghlink:hover { color: #fff; }
header a.ghlink svg { width: 17px; height: 17px; fill: currentColor; }
header .btn.primary { background: var(--accent); color: #fff; border: none; }
header .btn.primary:hover { background: rgb(50,150,255); }
#sendGroup .btn.primary:hover:not(:disabled) { background: rgb(50,150,255); }
#sendMenu .sendm { display: block; width: 100%; text-align: left; background: transparent;
  border: none; color: var(--txt2); font-size: 12.5px; padding: 8px 12px;
  cursor: pointer; border-radius: 6px; }
#sendMenu .sendm:hover { background: var(--elev); color: var(--txt); }
header .btn:disabled { opacity: 0.4; cursor: default; }
header .spacer { flex: 1; }
#status { color: var(--txt3); font-size: 12px; }
main { flex: 1; display: flex; min-height: 0; }
/* ---- canvas area ---- */
#stage { flex: 1; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; }
#stage img { max-width: 92%; max-height: 92%; border-radius: 2px; }
#viewBtns { position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  display: none; gap: 0; z-index: 5; background: rgba(28,28,30,0.85);
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
#viewBtns .vbtn { background: transparent; color: var(--txt2); border: none;
  padding: 7px 18px; cursor: pointer; font-size: 12.5px; transition: all .12s; }
#viewBtns .vbtn:hover { color: var(--txt); }
#viewBtns .vbtn.on { background: var(--elev); color: #fff; }
/* image hover actions (enlarge + close, close on the right) */
#imgWrap { position: relative; display: flex; align-items: center;
  justify-content: center; max-width: 96%; max-height: 96%; }
#imgWrap img { max-width: 100%; max-height: 96vh; border-radius: 2px;
  transform: scale(var(--zoom, 1)); transform-origin: center center;
  transition: transform .08s ease-out, filter .18s; }
#imgWrap.zoomed img { cursor: zoom-out; }
#imgWrap.zoomed:hover img { filter: none; }
#imgWrap:hover img { filter: brightness(0.92); }
#imgActions { position: absolute; top: 10px; right: 10px; display: flex;
  gap: 8px; opacity: 0; transition: opacity .15s; }
#imgWrap:hover #imgActions { opacity: 1; }
.abtn { width: 32px; height: 32px; border-radius: 50%; border: none;
  background: rgba(20,20,22,0.55); color: rgba(255,255,255,0.75);
  font-size: 14px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; backdrop-filter: blur(6px);
  box-shadow: 0 1px 6px rgba(0,0,0,0.35);
  transition: background .12s, color .12s, transform .12s; }
.abtn:hover { background: rgba(20,20,22,0.85); color: #fff; transform: scale(1.06); }
.abtn svg { width: 14px; height: 14px; stroke: currentColor;
  stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#drop { position: absolute; inset: 10%; border: 2px dashed var(--txt3);
  border-radius: 12px; display: flex; flex-direction: column; gap: 8px;
  align-items: center; justify-content: center; cursor: pointer;
  color: var(--txt2); transition: border-color .15s, background .15s; }
#drop:hover, #drop.drag { border-color: var(--accent); background: rgba(10,132,255,0.04); }
#drop .big { font-size: 15px; color: var(--txt); }
#drop .small { font-size: 12px; color: var(--txt3); }
/* ---- side panel ---- */
#panel { width: 300px; flex: none; background: var(--surface);
  border-left: 1px solid var(--border); overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 4px; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { padding: 5px 12px; border-radius: 14px; background: var(--elev);
  border: 1px solid var(--border); color: var(--txt2); font-size: 12px;
  cursor: pointer; transition: all .12s; }
.chip:hover { color: var(--txt); }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.pp-row { display: flex; gap: 6px; margin: 6px 0 2px; }
.pbtn { flex: 1; padding: 6px 0; border-radius: 14px; background: transparent;
  border: 1px solid var(--border); color: var(--txt2); font-size: 11.5px;
  cursor: pointer; transition: all .12s; }
.pbtn:hover { color: var(--txt); border-color: var(--txt3); }
.pbtn.ok { color: var(--accent); border-color: var(--accent); }
.slider { padding: 8px 0; }
.slider .row { display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 4px; }
.slider label { font-size: 11px; letter-spacing: 0.2px; color: var(--txt2);
  font-weight: 500; }
.slider .v { font-size: 12px; color: var(--txt3); font-variant-numeric: tabular-nums; }
.slider input[type=range] { width: 100%; height: 22px; -webkit-appearance: none;
  background: transparent; cursor: pointer; margin: 0; }
.slider input[type=range]::-webkit-slider-runnable-track { height: 3px;
  background: var(--elev); border-radius: 2px; }
.slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none;
  width: 15px; height: 15px; border-radius: 50%; background: #fff;
  margin-top: -6px; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.slider input[type=range]::-moz-range-track { height: 3px;
  background: var(--elev); border-radius: 2px; }
.slider input[type=range]::-moz-range-thumb { width: 15px; height: 15px;
  border-radius: 50%; background: #fff; border: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--mod);
  display: inline-block; margin-left: 5px; vertical-align: 1px; }
input[type=file] { display: none; }
/* ---- mobile: fullscreen effects menu ---- */
#menuBtn { display: none; align-items: center; justify-content: center;
  width: 36px; height: 32px; padding: 0; }
#menuBtn .icon { width: 18px; height: 18px; stroke: currentColor;
  stroke-width: 2; fill: none; stroke-linecap: round; }
#overlay { display: none; position: fixed; inset: 0; z-index: 30;
  background: var(--bg); flex-direction: column; }
#overlay.open { display: flex; }
#overlay .head { flex: none; display: flex; align-items: center;
  gap: 10px; height: 52px; padding: 0 14px; background: var(--surface);
  border-bottom: 1px solid var(--border); }
#overlay .head .t { flex: 1; font-size: 13px; font-weight: 600; color: #fff; }
#overlay .body { flex: 1; overflow-y: auto; padding: 16px 18px
  calc(16px + env(safe-area-inset-bottom)); }
#overlay .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
#overlay .slider { padding: 12px 0; }
#overlay .slider label { font-size: 13px; }
#overlay .slider .v { font-size: 14px; color: var(--txt2); }
#overlay .slider input[type=range] { height: 30px; }
#overlay .slider input[type=range]::-webkit-slider-thumb {
  width: 26px; height: 26px; margin-top: -12px; }
#overlay .slider input[type=range]::-moz-range-thumb {
  width: 26px; height: 26px; }
@media (max-width: 760px) {
  header { gap: 8px; padding: 0 10px; }
  #menuBtn { display: flex; }
  header .btn { padding: 0; }              /* icon buttons, no text */
  header .btn.primary { padding: 8px 14px; } /* Export keeps its text */
  header #status { display: none; }        /* declutter; timing shows in overlay title */
  #viewBtns { top: 10px; }
  #viewBtns .vbtn { padding: 9px 22px; }  /* larger touch target */
  #panel { display: none; }              /* effects live in the hamburger overlay on phone */
}
@media (pointer: coarse) {
  #imgActions { opacity: 1; }                 /* no hover on touch: always show */
  .abtn { width: 38px; height: 38px; }        /* bigger touch targets */
  .abtn svg { width: 17px; height: 17px; }
  .chip { padding: 7px 14px; }
}
</style></head>
<body>
<header>
  <a class="ghlink" href="https://github.com/jordandubu/isophote" target="_blank"

  </button>

</header>
<div id="settingsPop" style="display:none; position:absolute; top:48px; left:10px; z-index:40;

<script>
const PRESETS = {
  art:    {len:40, width:9, layers:2, flow_smooth:8, base_radius:6, relief:0.10},
  medium: {len:30, width:4, layers:3, flow_smooth:8, base_radius:6, relief:0.15},
  bold:   {len:60, width:5, layers:2, flow_smooth:8, base_radius:8, relief:0.10},
  pastel: {len:30, width:5, layers:3, flow_smooth:8, base_radius:9, relief:0.00},
};
const DEFAULTS = {len:40, width:9, layers:2, flow_smooth:8, base_radius:6, relief:0.10, impasto:0, seed:42, sscale:1, imgscale:2};

    // new multi-channel queue from the addon: {kind:"multi", kinds, pngs[0]=references}
    if (d.kind === "multi" && Array.isArray(d.kinds) && Array.isArray(d.pngs) && d.pngs.length === d.kinds.length && !bridgeImagePending) {
      let h = 0;
      for (const png of d.pngs)
        for (let i = 0; i < png.length; i += 4096) h = (h + (png.charCodeAt(i) + i)) | 0;
      if (h === bridgeLastPainted) return;
      bridgeLastPainted = h;          // claim immediately: blocks sample load
      bridgeImagePending = true;
      try {
        bridgeKinds = d.kinds;
        bridgeImgs = {};
        paintedByKind = null;
        multiRef = null;
        activeKind = d.kinds[0];
        d.kinds.forEach((k, i) => {
          const b64 = d.pngs[i];
          bridgeImgs[k] = { b64, blob: b64ToBlob(b64, "image/png") };
        });
        $("bridgeState").__show(
          `received ${kindList(d.kinds)} — painting ${KIND_LABEL[d.kinds[0]] || d.kinds[0]} in view, all on send…`);
        await load(bridgeImgs[d.kinds[0]].blob);   // reference through the normal path
        // load() overwrites srcW/srcH with kinds[0]'s dims; re-pin them to
        // the LARGEST channel so brush math matches the working rect
        const ref = await multiRefRect();
        srcW = ref.refW; srcH = ref.refH;
        await livePaint();
        bridgeLastPainted = h;
        fetch(bridgeURL("/ack"), { method: "POST", body: "{}" }).catch(() => {});
        $("bridgeState").__show(
          `received ${kindList(d.kinds)} — adjust sliders freely; ALL channels repaint on Send`);
      } finally {
        bridgeImagePending = false;
      }
      return;
    }
    if (d.kind === "image" && d.bgr_png && !bridgeImagePending) {
      // sticky poll: same image repeats every 1.5s until acked; skip if this
      // tab already painted it (avoid re-paint loop while waiting for ack)
      let h = 0;
      for (let i = 0; i < d.bgr_png.length; i += 4096)
        h = (h + (d.bgr_png.charCodeAt(i) + i)) | 0;
      if (h === bridgeLastPainted) return;
      bridgeLastPainted = h;          // claim immediately: blocks sample load
      bridgeImagePending = true;
      try {
        $("bridgeState").__show("received image — painting…");
        const blob = b64ToBlob(d.bgr_png, "image/png");
        await load(blob);                 // reuse the normal load path
        await livePaint();                // paint now, don't wait for debounce
        bridgeLastPainted = h;
        // painted; ack so the bridge clears it (sticky /poll can't be stolen)
        fetch(bridgeURL("/ack"), { method: "POST", body: "{}" }).catch(() => {});
        $("bridgeState").__show("painted — click Send to Blender when done");
      } finally {
        bridgeImagePending = false;
      }
    }
  } catch (e) {
    $("bridgeState").__show("bridge offline — restart Blender (runs the relay on 127.0.0.1:8778)");
  }
  bridge.inFlight = false;
}
async function sendToBlender() {
  if (!paintedURL) { $("bridgeState").__show("nothing painted yet"); return; }
  if (bridgeKinds && bridgeImgs) {
    // multi: repaint ALL queued channels with the current params, reference
    // first; falls back to reference-only (legacy payload) on failure
    $("bridgeState").__show("painting all channels…");
    try {
      const params = coreParamsForSize();
      // derive STRICTLY from bridgeKinds order (Object.values insertion order
    // may diverge from kinds after mixed legacy/multi sessions)
    const blobs = await Promise.all(bridgeKinds.map(k => bridgeImgs[k].blob));
      // all channels must be one size for the core: normalize to the
      // reference's working size (same math as livePaint)
      const dimsK = await Promise.all(blobs.map(async b => {
        const bm = await createImageBitmap(b);
        const d = { w: bm.width, h: bm.height };
        bm.close(); return d;
      }));
      const ref = multiRefVal() || await multiRefRect();
      const t_ = paintTargetLong(ref ? ref.refLong : null);
      // reference working size = livePaint's inW×inH for the reference rect
      const refW2 = ref && ref.refLong > t_ ? Math.round(ref.refW * (t_ / ref.refLong)) : (ref ? ref.refW : srcW);
      const refH2 = ref && ref.refLong > t_ ? Math.round(ref.refH * (t_ / ref.refLong)) : (ref ? ref.refH : srcH);
      const jobs = [];
      for (let i = 0; i < bridgeKinds.length; i++) {
        const d = dimsK[i];
        if (d.w !== refW2 || d.h !== refH2) {
          jobs[i] = upscaleImage(await decodeToBgra(blobs[i]), d.w, d.h, t_, refW2, refH2);
        } else {
          jobs[i] = decodeToBgra(blobs[i]).then(b => ({ bytes: b, w: d.w, h: d.h }));
        }
      }
      const ups = await Promise.all(jobs);
      const bgras = ups.map(u => u.bytes);
      const mw = refW2, mh = refH2;
      // livePaint() already painted with the current params (same seed,
      // same strokes) — reuse its per-kind results; fall back to a fresh
      // replay when it hasn't run for this state yet
      let urls;
      if (paintedByKind && bridgeKinds.every(k => paintedByKind[k])) {
        urls = bridgeKinds.map(k => paintedByKind[k].url);
      } else {
        ({ urls } = await wasmPaintMulti(bgras, mw, mh, { ...params, kinds: [null].concat(bridgeKinds) }));
      }
      const pngs = [];
      for (const url of urls) pngs.push(await blobToB64(await (await fetch(url)).blob()));
      await fetch(bridgeURL("/send_to_blender"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kinds: bridgeKinds, pngs }),
      });
      $("bridgeState").__show(
        `sent ${bridgeKinds.length} maps (${kindList(bridgeKinds)}) — now click 'Apply from Isophote' inside Blender`);
      return;
    } catch (e) {
      $("bridgeState").__show(
        `multi paint failed (${e.message || e}) — sending ${KIND_LABEL[bridgeKinds[0]]} only`);
      // fall through to the legacy single-channel send
    }
  }
  const blob = await (await fetch(paintedURL)).blob();
  const b64 = await blobToB64(blob);
  await fetch(bridgeURL("/send_to_blender"), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ png: b64, kind: bridgeKinds ? bridgeKinds[0] : "normal" }),
  });
  $("bridgeState").__show("sent — now click 'Apply from Isophote' inside Blender");
}

// current params in core scale (same math as livePaint/_sendAnimatedToBlender)
function coreParamsForSize() {
  const params = currentParams();
  const ref = multiRefVal();
  const ms_ = paintTargetLong(ref ? ref.refLong : null);
  const eff = ms_ / 720;
  const s = sscaleFromPos(params.sscale) * eff;
  return {
    brush_len: Math.max(4, Math.round(params.len * s)),
    brush_w: Math.max(1, Math.round(params.width * s)),
    layers: Math.round(params.layers),
    relief: params.relief,
    base_radius: Math.max(2, Math.round(params.base_radius * s)),
    flow_smooth: Math.max(2, Math.round(params.flow_smooth * s)),
    seed: Math.round(params.seed),
    max_size: ms_,
    impasto: params.impasto || 0,
  };
}

// Upscale BGRA bytes so the long edge == target (browser bilinear).
// Needed because the wasm core only downsizes, never upsizes.
async function upscaleImage(bgra, w, h, targetLong, outW, outH) {
  // outW/outH: exact destination dims (keep each channel's relative size).
  // Without them: scale the image's own long edge to targetLong.
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  const imgData = ctx.createImageData(w, h);
  const d = imgData.data;
  for (let i = 0; i < w * h; i++) {
    d[i * 4] = bgra[i * 4 + 2]; d[i * 4 + 1] = bgra[i * 4 + 1];
    d[i * 4 + 2] = bgra[i * 4]; d[i * 4 + 3] = bgra[i * 4 + 3];
  }
  ctx.putImageData(imgData, 0, 0);
  // outW/outH: stretch independently so ANY source lands on the exact
  // reference rect; otherwise scale own long edge to targetLong
  const nw = outW || Math.round(w * (targetLong / Math.max(w, h)));
  const nh = outH || Math.round(h * (targetLong / Math.max(w, h)));
  const c2 = document.createElement("canvas");
  c2.width = nw; c2.height = nh;
  const ctx2 = c2.getContext("2d");
  ctx2.imageSmoothingEnabled = true;
  ctx2.imageSmoothingQuality = "high";
  ctx2.drawImage(c, 0, 0, nw, nh);
  const d2 = ctx2.getImageData(0, 0, nw, nh).data;
  const out = new Uint8Array(nw * nh * 4);
  for (let i = 0; i < nw * nh * 4; i += 4) {
    out[i] = d2[i + 2]; out[i + 1] = d2[i + 1]; out[i + 2] = d2[i]; out[i + 3] = d2[i + 3];
  }
  return { bytes: out, w: nw, h: nh };
}
// File/Blob -> BGRA Uint8Array at full size (same swap as load())
async function decodeToBgra(blob) {
  const bitmap = await createImageBitmap(blob);
  const c = document.createElement("canvas");
  c.width = bitmap.width; c.height = bitmap.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(bitmap, 0, 0);
  const d = ctx.getImageData(0, 0, bitmap.width, bitmap.height).data;
  const out = new Uint8Array(d.length);
  for (let i = 0; i < d.length; i += 4) {
    out[i] = d[i + 2]; out[i + 1] = d[i + 1]; out[i + 2] = d[i]; out[i + 3] = d[i + 3];
  }
  return out;
}
/* send animated: paint N extra seeds silently and post them all; Blender
   wires them into an image sequence so the paint flickers as strokes */
async function sendAnimatedToBlender(count = 5) {
  if (!srcBgrBytes) { $("bridgeState").__show("nothing to send"); return; }
  try {
    await _sendAnimatedToBlender(count);
  } catch (e) {
    $("animProgress").style.display = "none";
    $("bridgeState").__show("animated send failed: " + (e.message || e));
  }
}
async function _sendAnimatedToBlender(count = 10) {
  const baseSeed = Math.round(parseFloat($("seed").value));
  const core0 = coreParamsForSize();
  const core = {
    brush_len: core0.brush_len,
    brush_w: core0.brush_w,
    layers: core0.layers,
    relief: core0.relief,
    base_radius: core0.base_radius,
    flow_smooth: core0.flow_smooth,
    max_size: core0.max_size,
  };
  $("animProgress").style.display = "flex";
  $("animBar").style.width = "0%";
  const multi = !!(bridgeKinds && bridgeImgs);
  const k = multi ? bridgeKinds.length : 1;
  const total = count;   // exactly N frames: user asked for N, not N+1
  $("animCount").textContent = multi
    ? `1 / ${total} × ${k} channels` : `1 / ${total}`;
  const frames = [];
  if (multi) {
    // each frame paints ALL channels coherently: outer = seed, inner = kind
    // (bridgeKinds order). decode every queued channel once up front,
    // upscale all of them when Image Scale > 1 (core never upsizes)
    // derive STRICTLY from bridgeKinds order (Object.values insertion order
    // may diverge from kinds after mixed legacy/multi sessions)
    const blobs = await Promise.all(bridgeKinds.map(k => bridgeImgs[k].blob));
    // all channels must be one size for the core: normalize to the
    // reference's working size (same math as livePaint)
    const dimsA = await Promise.all(blobs.map(async b => {
      const bm = await createImageBitmap(b);
      const d = { w: bm.width, h: bm.height };
      bm.close(); return d;
    }));
    const ref = multiRefVal() || await multiRefRect();
    const tA = paintTargetLong(ref ? ref.refLong : null);
    const refW = ref && ref.refLong > tA ? Math.round(ref.refW * (tA / ref.refLong)) : (ref ? ref.refW : srcW);
    const refH = ref && ref.refLong > tA ? Math.round(ref.refH * (tA / ref.refLong)) : (ref ? ref.refH : srcH);
    const jobs = [];
    for (let i = 0; i < bridgeKinds.length; i++) {
      const d = dimsA[i];
      if (d.w !== refW || d.h !== refH) {
        jobs[i] = upscaleImage(await decodeToBgra(blobs[i]), d.w, d.h, tA, refW, refH);
      } else {
        jobs[i] = decodeToBgra(blobs[i]).then(b => ({ bytes: b, w: d.w, h: d.h }));
      }
    }
    const ups = await Promise.all(jobs);
    const bgras = ups.map(u => u.bytes);
    const aw = refW, ah = refH;
    for (let i = 0; i < count; i++) {
      const { urls } = await wasmPaintMulti(bgras, aw, ah, { ...core, seed: baseSeed + i, kinds: [null].concat(bridgeKinds) });
      const one = [];
      for (const url of urls) one.push(await blobToB64(await (await fetch(url)).blob()));
      frames.push(one);
      $("animBar").style.width = Math.round((i + 1) / total * 100) + "%";
      $("animCount").textContent = `${i + 1} / ${total} × ${k} channels`;
    }
    $("animCount").textContent = "sending to Blender…";
    await fetch(bridgeURL("/send_to_blender"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kinds: bridgeKinds, anim: frames }),
    });
    $("animProgress").style.display = "none";
    $("bridgeState").__show(
      `sent ${total} frames × ${k} maps (${kindList(bridgeKinds)}) — now click 'Apply from Isophote' (Animated checked) inside Blender`);
    return;
  }
  const frames1 = [];
  // frame 0 is the current painting
  const blob0 = await (await fetch(paintedURL)).blob();
  frames1.push(await blobToB64(blob0));
  const target1 = paintTargetLong();
  let abytes = srcBgrBytes, aW = srcW, aH = srcH;
  if (target1 > Math.max(srcW, srcH)) {
    const up = await upscaleImage(srcBgrBytes, srcW, srcH, target1);
    abytes = up.bytes; aW = up.w; aH = up.h;
  }
  for (let i = 1; i < count; i++) {
    const { url } = await wasmPaint(abytes, aW, aH, { ...core, seed: baseSeed + i });
    frames1.push(await blobToB64(await (await fetch(url)).blob()));
    const pct = Math.round((i + 1) / count * 100);
    $("animBar").style.width = pct + "%";
    $("animCount").textContent = `${i + 1} / ${count}`;
  }
  $("animCount").textContent = "sending to Blender…";
  await fetch(bridgeURL("/send_to_blender"), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ anim: frames1 }),
  });
  $("animProgress").style.display = "none";
  $("bridgeState").__show(`sent ${frames1.length} frames — now click 'Apply from Isophote' (Animated checked) inside Blender`);
}
/* dropdown wiring */
$("sendCaret").onclick = (e) => { e.stopPropagation();
  $("sendMenu").style.display = $("sendMenu").style.display === "none" ? "block" : "none"; };
document.addEventListener("click", (e) => {
  if (!e.target.closest("#sendMenu") && !e.target.closest("#sendCaret"))
    $("sendMenu").style.display = "none";
});
document.querySelectorAll("#sendMenu .sendm").forEach(b => b.onclick = async () => {
  $("sendMenu").style.display = "none";
  if (b.dataset.act === "anim") {
    const n = Math.min(24, Math.max(1, Math.round(+($("animCountInput").value) || 5)));
    await sendAnimatedToBlender(n);
  }
  else await sendToBlender();
});
$("bridgeSend").onclick = () => { sendToBlender(); };
let bridgeTimer = null;
function startBridgePolling() {
  if (bridge.on) return;
  bridge.on = true;
  bridgePoll();
  bridgeTimer = setInterval(bridgePoll, 1500);
}
function stopBridgePolling() {
  bridge.on = false;
  clearInterval(bridgeTimer);
  bridgeTimer = null;
  if ($("bridgeState")) $("bridgeState").textContent = "";
}
if (settings.addonBlender) startBridgePolling();
/* helpers */
function b64ToBlob(b64, type) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type });
}
function blobToB64(blob) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.readAsDataURL(blob);
  });
};
